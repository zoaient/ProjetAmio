plugins {
    id 'com.android.application'
}

android {
    namespace = 'eu.telecomnancy.amio.lightwatch'
    compileSdk = 33

    defaultConfig {
        applicationId = "eu.telecomnancy.amio.lightwatch"
        minSdk = 26            // Android 8.0
        targetSdk = 29         // Android 10  <-- API cible du module
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding = false    // les vues sont récupérées avec findViewById()
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Déclarées dès maintenant, utilisées au T.P. 4 :
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.8.1'

    testImplementation 'junit:junit:4.13.2'
}
